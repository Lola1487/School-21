services:
  # Первый контейнер - твой FastCGI сервер из Part 5
  fastcgi_server:
    image: my_nginx_fastcgi:latest
    container_name: fastcgi_server
    networks:
      - app_network
    # Не мапим порты на хост, работает только в локальной сети

  # Второй контейнер - nginx прокси
  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:8080"  # Пробрасываем порт 8080 контейнера на порт 80 хоста
    networks:
      - app_network
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastcgi_server

networks:
  app_network:
    driver: bridge
